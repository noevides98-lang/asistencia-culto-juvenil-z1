<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Asistencia Culto Juvenil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; padding:16px; }
    h1,h2 { text-align:center; }
    .card { background:#fff; border-radius:8px; padding:16px; max-width:480px; margin:0 auto 16px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    label { display:block; margin-top:10px; font-weight:bold; }
    select, button { width:100%; padding:10px; margin-top:6px; font-size:16px; }
    button { background:#1976d2; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    button.secondary { background:#555; }
    table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
    th,td { border:1px solid #333; padding:6px; text-align:center; }
    th { background:#e0e0e0; }
    .hidden { display:none; }
    .totalBus { font-size:18px; font-weight:bold; text-align:center; margin-top:8px; }

    @media print {
      body { background:#fff; padding:0; }
      .card:not(.printable) { display:none !important; }
      button { display:none !important; }
      h1 { display:none; }
      .print-footer { display:block; margin-top:12px; text-align:center; font-size:12px; }
    }

    .print-footer { display:none; }
  </style>
</head>
<body>

<h1>Asistencia Culto Juvenil Z1</h1>
<p style="text-align:center;font-weight:bold;" id="mesActivo"></p>

<div class="card">
  <h2>Registrar persona</h2>

  <label>Sector / Zona</label>
  <select id="sector">
    <option value="">Seleccione</option>
    <option value="1">Sector 1</option><option value="2">Sector 2</option><option value="3">Sector 3</option>
    <option value="4">Sector 4</option><option value="5">Sector 5</option><option value="6">Sector 6</option>
    <option value="7">Sector 7</option><option value="8">Sector 8</option><option value="9">Sector 9</option>
    <option value="10">Sector 10</option>
  </select>

  <label>Grupo</label>
  <select id="grupo">
    <option value="">Seleccione</option>
    <option value="adulto">Adulto</option>
    <option value="joven">Joven</option>
    <option value="nino">Niño</option>
  </select>

  <label>Género</label>
  <select id="genero">
    <option value="">Seleccione</option>
    <option value="hombre">Hombre</option>
    <option value="mujer">Mujer</option>
  </select>

  <label>Tipo</label>
  <select id="tipo">
    <option value="">Seleccione</option>
    <option value="hermano">Hermano</option>
    <option value="amigo">Amigo</option>
  </select>
<label for="cantidad">Cantidad de personas</label>
<select id="cantidad">
  <option value="1" selected>1 persona</option>
  <option value="2">2 personas</option>
  <option value="3">3 personas</option>
  <option value="4">4 personas</option>
  <option value="5">5 personas</option>
</select>
  <button onclick="registrar()">Agregar persona</button>
  <div class="totalBus" id="totalBus">Total en el bus: 0</div>
<button class="secondary" onclick="nuevaSalida()" style="margin-top:10px;background:#b71c1c;">🗑️ Nueva salida de bus</button>
</div>

<div class="card">
  <button class="secondary" onclick="mostrarResumenSectores()">📊 Resumen por sectores</button>
  <button class="secondary" onclick="mostrarResumenPastoral()" style="margin-top:8px;">🧾 Resumen distrito</button>
  <button class="secondary" onclick="exportarPDF()" style="margin-top:8px;">🖨️ Exportar PDF</button>
</div>

<div class="card hidden printable" id="resumenSectores">
  <h2>Resumen por sectores</h2>
  <button class="secondary" onclick="toggleNinos()">🔁 Incluir / Separar niños</button>
  <table>
    <thead>
      <tr><th rowspan="2">Sector</th><th colspan="3">Adultos</th><th colspan="3">Jóvenes</th></tr>
      <tr><th>Hnos</th><th>Amigos</th><th>Total</th><th>Hnos</th><th>Amigos</th><th>Total</th></tr>
    </thead>
    <tbody id="tablaSectores"></tbody>
    <tfoot>
      <tr style="font-weight:bold;background:#f3f3f3;">
        <th colspan="6">TOTAL GENERAL</th><th id="totalSector">0</th>
      </tr>
    </tfoot>
  </table>
  <div class="print-footer" id="printFooter"></div>
</div>

<div class="card hidden printable" id="resumenPastoral">
  <h2>Asistencia al culto juvenil</h2>
  <table><tbody id="tablaPastoral"></tbody></table>
  <div class="print-footer" id="printFooterPastoral"></div>
</div>

<script>
  const ahora = new Date();
  const mesClave = `asistencia-${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('mesActivo').innerText = `Bus activo: ${ahora.toLocaleString('es-SV',{month:'long',year:'numeric'})}`;

  const datos = JSON.parse(localStorage.getItem(mesClave) || '{}');
  let totalBus = Number(localStorage.getItem(mesClave+'-total') || 0);
  let incluirNinosComoJovenes = false;

  const sectorEl = document.getElementById('sector');
  const grupoEl = document.getElementById('grupo');
  const generoEl = document.getElementById('genero');
  const tipoEl = document.getElementById('tipo');

  function registrar() {
const sector = sectorEl.value;
  const grupo = grupoEl.value;
  const genero = generoEl.value;
  const tipo = tipoEl.value;
  const cantidad = Number(document.getElementById('cantidad').value);

  if (!sector || !grupo || !genero || !tipo) {
    alert('Completá todos los campos');
    return;
  }

  if (!datos[sector]) datos[sector] = [];

  for (let i = 0; i < cantidad; i++) {
    datos[sector].push({ grupo, genero, tipo });
  }

  totalBus += cantidad;

  localStorage.setItem(mesClave, JSON.stringify(datos));
  localStorage.setItem(mesClave + '-total', totalBus);

  document.getElementById('totalBus').innerText =
    'Total en el bus: ' + totalBus;

  sectorEl.value = '';
  grupoEl.value = '';
  generoEl.value = '';
  tipoEl.value = '';
  document.getElementById('cantidad').value = '1';
  }

  function mostrarResumenSectores() {
    const tbody = document.getElementById('tablaSectores');
    tbody.innerHTML = '';
    let totalGeneral = 0;
    for (let i = 1; i <= 10; i++) {
      const registros = datos[i] || [];
      let aH=0,aA=0,jH=0,jA=0;
      registros.forEach(r => {
        if (r.grupo === 'adulto') r.tipo === 'hermano' ? aH++ : aA++;
        if (r.grupo === 'joven') r.tipo === 'hermano' ? jH++ : jA++;
        if (r.grupo === 'nino' && incluirNinosComoJovenes) r.tipo === 'hermano' ? jH++ : jA++;
      });
      const filaTotal = (aH+aA)+(jH+jA);
      totalGeneral += filaTotal;
      tbody.innerHTML += `<tr><td>${i}</td><td>${aH}</td><td>${aA}</td><td>${aH+aA}</td><td>${jH}</td><td>${jA}</td><td>${jH+jA}</td></tr>`;
    }
    document.getElementById('totalSector').innerText = totalGeneral;
    document.getElementById('resumenSectores').classList.remove('hidden');
    document.getElementById('resumenPastoral').classList.add('hidden');
  }

  function mostrarResumenPastoral() {
    let c={AH:0,AM:0,JH:0,JM:0,NH:0,NM:0};
    Object.values(datos).flat().forEach(r=>{
      if(r.grupo==='adulto') r.genero==='hombre'?c.AH++:c.AM++;
      if(r.grupo==='joven') r.genero==='hombre'?c.JH++:c.JM++;
      if(r.grupo==='nino') r.genero==='hombre'?c.NH++:c.NM++;
    });
    document.getElementById('tablaPastoral').innerHTML = `
      <tr><th colspan="2">Adultos</th></tr><tr><td>Hermanos</td><td>${c.AH}</td></tr><tr><td>Hermanas</td><td>${c.AM}</td></tr>
      <tr><th colspan="2">Jóvenes</th></tr><tr><td>Hermanos</td><td>${c.JH}</td></tr><tr><td>Hermanas</td><td>${c.JM}</td></tr>
      <tr><th colspan="2">Niños</th></tr><tr><td>Niños</td><td>${c.NH}</td></tr><tr><td>Niñas</td><td>${c.NM}</td></tr>
      <tr><th>Total general</th><th>${totalBus}</th></tr>`;
    document.getElementById('resumenPastoral').classList.remove('hidden');
    document.getElementById('resumenSectores').classList.add('hidden');
  }

  function exportarPDF() {
    const tipo = prompt('Escribí:\n1 = Resumen por sectores\n2 = Resumen pastoral');
    const fechaHora = new Date().toLocaleString();
    document.getElementById('printFooter').innerText = 'Generado el: ' + fechaHora;
    document.getElementById('printFooterPastoral').innerText = 'Generado el: ' + fechaHora;
    if (tipo === '1') { mostrarResumenSectores(); setTimeout(()=>window.print(),300); }
    if (tipo === '2') { mostrarResumenPastoral(); setTimeout(()=>window.print(),300); }
  }

  function nuevaSalida() {
    if (!confirm('¿Seguro que deseas iniciar una nueva salida de bus? Se borrarán los datos de este mes.')) return;
    localStorage.removeItem(mesClave);
    localStorage.removeItem(mesClave+'-total');
    location.reload();
  }

  function toggleNinos() {
    incluirNinosComoJovenes = !incluirNinosComoJovenes;
    mostrarResumenSectores();
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
</html>
