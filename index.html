<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistencia Culto Juvenil Z1</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1976d2">
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182334;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:650px;margin-inline:auto}h1{font-size:1.45rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 14px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#586579;font-size:.88rem}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #172d4514;margin:14px 0}label{display:block;font-weight:650;margin:12px 0 5px}select,button{font:inherit;min-height:44px;border-radius:9px}select{width:100%;padding:9px;border:1px solid #bcc8d7;background:white}button{cursor:pointer;border:0;padding:10px 14px;background:#1976d2;color:white;font-weight:650}.secondary{background:#526071}.danger{background:#a72b34}.outline{background:white;color:#26435d;border:1px solid #b5c3d3}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.total{text-align:center;font-size:1.3rem;font-weight:750;margin:14px}.hidden{display:none!important}.history-entry{border:1px solid #d6dee7;border-radius:11px;padding:12px;margin:9px 0}.history-entry p{margin:5px 0}.small{font-size:.85rem}.history-entry .actions button{font-size:.9rem}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem}th,td{border:1px solid #667483;padding:7px 4px;text-align:center}th{background:#e8eef5}tfoot th{background:#dce8f5}.footer{display:none;font-size:.75rem;text-align:right;margin-top:18px}.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modal{background:white;border-radius:14px;padding:20px;width:min(100%,430px);max-height:90vh;overflow:auto}.note{font-size:.8rem;color:#586579}#historyPanel{max-height:70vh;overflow:auto}@media print{@page{size:A4;margin:16mm}body{max-width:none;padding:0;background:white}.header,.no-print,#historyPanel,.modal-bg{display:none!important}.card{display:none!important;box-shadow:none;padding:0;margin:0}.card.print-target{display:block!important}.card.print-target h2{text-align:center}.footer{display:block!important}table{font-size:11px}th,td{padding:6px}.hidden.print-target{display:block!important}}
</style>
</head>
<body>
<header class="header no-print"><div><h1>Asistencia Culto Juvenil Z1</h1><div class="muted" id="mesActivo"></div></div><button class="secondary" id="histBtn" aria-label="Abrir historial">☷ Historial</button></header>
<section class="card no-print"><h2>Registrar personas</h2>
<label for="sector">Sector</label><select id="sector"><option value="">Seleccione</option></select>
<label for="grupo">Grupo</label><select id="grupo"><option value="">Seleccione</option><option value="adulto">Adulto</option><option value="joven">Joven</option><option value="nino">Niño</option></select>
<label for="genero">Género</label><select id="genero"><option value="">Seleccione</option><option value="hombre">Hombre</option><option value="mujer">Mujer</option></select>
<label for="tipo">Tipo</label><select id="tipo"><option value="">Seleccione</option><option value="hermano">Hermano</option><option value="amigo">Amigo</option></select>
<label for="cantidad">Cantidad de personas</label><select id="cantidad"><option value="1">1 persona</option><option value="2">2 personas</option><option value="3">3 personas</option><option value="4">4 personas</option><option value="5">5 personas</option></select>
<button id="addBtn" style="width:100%;margin-top:15px">Agregar personas</button><div class="total" id="totalBus">Total en el bus: 0</div><button class="danger" id="newBtn" style="width:100%">Nueva salida de bus</button></section>
<section class="card no-print"><div class="actions"><button class="secondary" id="sectorBtn">Resumen por sectores</button><button class="secondary" id="pastorBtn">Resumen pastoral</button></div><button id="exportBtn" style="width:100%;margin-top:9px">Exportar PDF</button></section>
<section id="historyPanel" class="card hidden no-print"><div class="header"><h2>Lista reciente</h2><button class="outline" id="closeHistory">Cerrar</button></div><div id="historyList"></div></section>
<section id="resumenSectores" class="card hidden"><h2>Resumen por sectores</h2><button class="secondary no-print" id="toggleNinos">Niños incluidos en jóvenes: NO</button><div class="scroll"><table><thead><tr><th rowspan="2">Sector</th><th colspan="3">Adultos</th><th colspan="3">Jóvenes</th></tr><tr><th>Hnos</th><th>Amigos</th><th>Total</th><th>Hnos</th><th>Amigos</th><th>Total</th></tr></thead><tbody id="tablaSectores"></tbody><tfoot><tr><th colspan="6">TOTAL GENERAL DEL RESUMEN</th><th id="totalSector">0</th></tr></tfoot></table></div><div class="footer" id="footerSectores"></div></section>
<section id="resumenPastoral" class="card hidden"><h2>Asistencia al culto juvenil</h2><table><tbody id="tablaPastoral"></tbody></table><div class="footer" id="footerPastoral"></div></section>
<div id="editModal" class="modal-bg hidden no-print" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal"><h2 id="editTitle">Editar registro</h2><label for="eSector">Sector</label><select id="eSector"></select><label for="eGrupo">Grupo</label><select id="eGrupo"><option value="adulto">Adulto</option><option value="joven">Joven</option><option value="nino">Niño</option></select><label for="eGenero">Género</label><select id="eGenero"><option value="hombre">Hombre</option><option value="mujer">Mujer</option></select><label for="eTipo">Tipo</label><select id="eTipo"><option value="hermano">Hermano</option><option value="amigo">Amigo</option></select><label for="eCantidad">Cantidad</label><select id="eCantidad"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><div class="actions" style="margin-top:17px"><button class="outline" id="cancelEdit">Cancelar</button><button id="saveEdit">Guardar cambios</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const now=new Date(), mesClave=`asistencia-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`, historyKey=mesClave+'-historial-v12';
$('mesActivo').textContent='Bus activo: '+now.toLocaleDateString('es-SV',{month:'long',year:'numeric'});
for(let i=1;i<=10;i++){for(const id of ['sector','eSector']){const op=document.createElement('option');op.value=String(i);op.textContent='Sector '+i;$(id).appendChild(op)}}
$('eSector').insertAdjacentHTML('afterbegin','<option value="">Seleccione</option>');
const fields=['sector','grupo','genero','tipo','cantidad'];
let registros=[], editarId=null, incluirNinosComoJovenes=false, currentView='';
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
function load(){try{const saved=JSON.parse(localStorage.getItem(historyKey));if(Array.isArray(saved)){registros=saved.filter(valid);return}}catch(e){console.warn('Historial no legible',e)}
// Migración sin pérdida de los datos de la versión anterior: los ingresos antiguos no tienen hora ni agrupación.
try{const old=JSON.parse(localStorage.getItem(mesClave)||'{}');for(const [sector,people] of Object.entries(old)){if(!Array.isArray(people))continue;for(const p of people){const r={id:uid(),sector:String(sector),grupo:p.grupo,genero:p.genero,tipo:p.tipo,cantidad:1,hora:null,legacy:true};if(valid(r))registros.push(r)}}if(registros.length)save()}catch(e){console.warn('Datos anteriores no legibles',e)}}
function valid(r){return r&&/^(?:[1-9]|10)$/.test(String(r.sector))&&['adulto','joven','nino'].includes(r.grupo)&&['hombre','mujer'].includes(r.genero)&&['hermano','amigo'].includes(r.tipo)&&Number.isInteger(Number(r.cantidad))&&Number(r.cantidad)>=1&&Number(r.cantidad)<=5}
function save(){try{localStorage.setItem(historyKey,JSON.stringify(registros));const old={};for(const r of registros){(old[r.sector]??=[]);for(let n=0;n<r.cantidad;n++)old[r.sector].push({grupo:r.grupo,genero:r.genero,tipo:r.tipo})}localStorage.setItem(mesClave,JSON.stringify(old));localStorage.setItem(mesClave+'-total',String(total()))}catch(e){alert('No se pudo guardar el registro en este dispositivo. Revisá el espacio disponible.')}}
function total(){return registros.reduce((sum,r)=>sum+Number(r.cantidad),0)}
function update(){ $('totalBus').textContent='Total en el bus: '+total();if(currentView==='sectores')renderSectores();if(currentView==='pastoral')renderPastoral();renderHistory()}
function registrar(){const r={id:uid(),hora:new Date().toISOString()};for(const key of fields)r[key]=$(key).value;r.cantidad=Number(r.cantidad);if(!valid(r)){alert('Completá todos los campos');return}registros.push(r);save();fields.forEach(f=>$(f).value=f==='cantidad'?'1':'');update()}
function showView(which){currentView=which;$('resumenSectores').classList.toggle('hidden',which!=='sectores');$('resumenPastoral').classList.toggle('hidden',which!=='pastoral');if(which==='sectores')renderSectores();else renderPastoral()}
function renderSectores(){let html='',general=0;for(let i=1;i<=10;i++){let aH=0,aA=0,jH=0,jA=0;for(const r of registros.filter(x=>Number(x.sector)===i)){const c=Number(r.cantidad);if(r.grupo==='adulto'){if(r.tipo==='hermano')aH+=c;else aA+=c}else if(r.grupo==='joven'||(r.grupo==='nino'&&incluirNinosComoJovenes)){if(r.tipo==='hermano')jH+=c;else jA+=c}}general+=aH+aA+jH+jA;html+=`<tr><td>${i}</td><td>${aH}</td><td>${aA}</td><td>${aH+aA}</td><td>${jH}</td><td>${jA}</td><td>${jH+jA}</td></tr>`}$('tablaSectores').innerHTML=html;$('totalSector').textContent=general;$('toggleNinos').textContent='Niños incluidos en jóvenes: '+(incluirNinosComoJovenes?'SÍ':'NO')}
function renderPastoral(){const c={AH:0,AM:0,JH:0,JM:0,NH:0,NM:0};for(const r of registros){const k=(r.grupo==='adulto'?'A':r.grupo==='joven'?'J':'N')+(r.genero==='hombre'?'H':'M');c[k]+=Number(r.cantidad)}$('tablaPastoral').innerHTML=`<tr><th colspan="2">Adultos</th></tr><tr><td>Hermanos</td><td>${c.AH}</td></tr><tr><td>Hermanas</td><td>${c.AM}</td></tr><tr><th colspan="2">Jóvenes</th></tr><tr><td>Hermanos</td><td>${c.JH}</td></tr><tr><td>Hermanas</td><td>${c.JM}</td></tr><tr><th colspan="2">Niños</th></tr><tr><td>Niños</td><td>${c.NH}</td></tr><tr><td>Niñas</td><td>${c.NM}</td></tr><tr><th>Total general</th><th>${total()}</th></tr>`}
const labels={adulto:'Adulto',joven:'Joven',nino:'Niño',hombre:'Hombre',mujer:'Mujer',hermano:'Hermano',amigo:'Amigo'};
function renderHistory(){const list=$('historyList');list.replaceChildren();if(!registros.length){list.textContent='Todavía no hay ingresos.';return}for(const r of [...registros].reverse()){const div=document.createElement('div');div.className='history-entry';const p=document.createElement('p');p.textContent=`Sector ${r.sector} › ${labels[r.grupo]} › ${labels[r.genero]} › ${labels[r.tipo]} › ${r.cantidad} ${r.cantidad===1?'persona':'personas'}`;const time=document.createElement('p');time.className='muted small';time.textContent=r.hora?'Hora: '+new Date(r.hora).toLocaleTimeString('es-SV'):'Registro anterior (hora no disponible)';const acts=document.createElement('div');acts.className='actions';const edit=document.createElement('button');edit.className='outline';edit.textContent='Editar';edit.onclick=()=>openEdit(r.id);const del=document.createElement('button');del.className='danger';del.textContent='Borrar';del.onclick=()=>{if(confirm('¿Eliminar este ingreso de '+r.cantidad+' persona(s)?')){registros=registros.filter(x=>x.id!==r.id);save();update()}};acts.append(edit,del);div.append(p,time,acts);list.appendChild(div)}}
function openEdit(id){const r=registros.find(x=>x.id===id);if(!r)return;editarId=id;for(const f of fields)$('e'+f[0].toUpperCase()+f.slice(1)).value=String(r[f]);$('editModal').classList.remove('hidden')}
function closeEdit(){editarId=null;$('editModal').classList.add('hidden')}
function saveEdit(){const r=registros.find(x=>x.id===editarId);if(!r)return;const next={...r};for(const f of fields)next[f]=$('e'+f[0].toUpperCase()+f.slice(1)).value;next.cantidad=Number(next.cantidad);if(!valid(next)){alert('Revisá todos los campos');return}Object.assign(r,next);save();closeEdit();update()}
function exportPDF(){const choice=prompt('¿Qué PDF querés exportar?\n1 = Resumen por sectores\n2 = Resumen pastoral');if(choice!=='1'&&choice!=='2')return;if(choice==='1'){incluirNinosComoJovenes=confirm('¿Incluir niños como jóvenes en el resumen por sectores?');showView('sectores')}else showView('pastoral');const stamp='Generado el: '+new Date().toLocaleString('es-SV');$('footerSectores').textContent=stamp;$('footerPastoral').textContent=stamp;$('resumenSectores').classList.toggle('print-target',choice==='1');$('resumenPastoral').classList.toggle('print-target',choice==='2');window.print()}
$('addBtn').onclick=registrar;$('histBtn').onclick=()=>{$('historyPanel').classList.toggle('hidden');renderHistory()};$('closeHistory').onclick=()=>$('historyPanel').classList.add('hidden');$('sectorBtn').onclick=()=>showView('sectores');$('pastorBtn').onclick=()=>showView('pastoral');$('toggleNinos').onclick=()=>{incluirNinosComoJovenes=!incluirNinosComoJovenes;renderSectores()};$('exportBtn').onclick=exportPDF;$('cancelEdit').onclick=closeEdit;$('saveEdit').onclick=saveEdit;$('newBtn').onclick=()=>{if(confirm('¿Iniciar una nueva salida? Se borrarán los registros del mes activo en este dispositivo.')){registros=[];save();update()}};
load();update();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
</script>
</body></html>
